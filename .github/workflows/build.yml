name: Build libmain.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build libmain.so
        run: |
          cmake --build build --target main -j$(nproc)

      - name: Locate and copy lib
        run: |
          find build -name "libmain.so" | head -1 | xargs -I{} cp {} libmain.so
          ls -lh libmain.so

      - name: Upload libmain.so
        uses: actions/upload-artifact@v4
        with:
          name: libmain-arm64-v8a
          path: libmain.so
          retention-days: 7
